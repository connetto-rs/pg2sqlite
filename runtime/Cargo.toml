[package]
name = "pg2sqlite-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "The SQLite functions and collation a pg2sqlite replica registers so jsonb, case folds and SQL helpers answer as PostgreSQL does."
homepage = "https://pg2sqlite.luca.phd"
repository = "https://github.com/connetto-rs/pg2sqlite"
documentation = "https://docs.rs/pg2sqlite-runtime"
readme = "README.md"
keywords = ["postgresql", "sqlite", "jsonb", "collation", "diesel"]
categories = ["database", "no-std"]

[dependencies]
# Reads, prints and compares jsonb, and rounds temporal values to a precision,
# the way PostgreSQL 18 does.
sql-values = { version = "0.7", default-features = false }
# Derives `Arbitrary` on both function sets for pg2sqlite's fuzz harnesses.
arbitrary = { version = "1", features = ["derive"], optional = true }
thiserror = { version = "2", default-features = false }
# Reads the platform's UTC wall clock, through `Date.now()` in a browser.
jiff = { version = "0.2.39", default-features = false, features = ["std", "js"], optional = true }
# Splits a managed connection's SQL into statements and parses its
# transaction controls.
sqlparser = { version = "0.64", default-features = false, optional = true }

# Reads whether SQLite still holds a transaction after a failure ended it.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
libsqlite3-sys = { version = "0.39", optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
sqlite-wasm-rs = { version = "0.5", default-features = false, optional = true }

# Registers the functions and collation on a native or WebAssembly diesel connection.
[dependencies.diesel]
version = "2.4"
default-features = false
features = ["sqlite"]
optional = true

[dependencies.diesel-dynamic-schema]
git = "https://github.com/diesel-rs/diesel"
branch = "upstream/sqlite-table-valued-functions-dynamic"
default-features = false
features = ["sqlite"]
optional = true

[dev-dependencies]
diesel = { version = "2.4", features = ["sqlite"] }
parking_lot = "0.13"
# The doctests and tests register the functions through `diesel`.
pg2sqlite-runtime = { path = ".", features = ["managed"] }

[features]
# Derives `Arbitrary` on `JsonbFunctions` and `CaseFoldFunctions`.
arbitrary = ["dep:arbitrary"]
# The `register` of `JsonbFunctions`, `CaseFoldFunctions` and `HelperFunction` on a diesel `SqliteConnection`.
diesel = ["dep:diesel", "dep:diesel-dynamic-schema"]
# `JiffUtcProvider`, the platform's UTC wall clock.
clock = ["dep:jiff"]
# `ManagedConnection`, which owns its transactions and statements and answers
# PostgreSQL's clock functions from the instants it samples at their starts.
# It implements diesel's `Connection`, which diesel opens to third-party
# connections behind its breaking-changes feature.
managed = [
    "diesel",
    "clock",
    "diesel/i-implement-a-third-party-backend-and-opt-into-breaking-changes",
    "dep:sqlparser",
    "dep:libsqlite3-sys",
    "dep:sqlite-wasm-rs",
]

[lints]
workspace = true
