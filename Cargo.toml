[package]
name = "pg2sqlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Translates PostgreSQL SQL into valid runnable SQLite SQL, emitting semantically equivalent output for types, RLS, FTS5, pgvector, and PostGIS constructs."
homepage = "https://pg2sqlite.luca.phd"
repository = "https://github.com/connetto-rs/pg2sqlite"
documentation = "https://docs.rs/pg2sqlite"
readme = "README.md"
keywords = ["postgresql", "sqlite", "sql", "translation", "migration"]
categories = ["database", "parser-implementations"]
# The integration tests are modules of one test binary, `it`, so the crate is
# linked once for all of them. The `[[test]]` entries below say why each other
# test target needs its own process.
autotests = false

[dependencies]
sqlparser = { version = "0.64", default-features = false, features = ["visitor"] }
sqlparser-plpgsql = { git = "https://github.com/connetto-rs/sqlparser-plpgsql", branch = "main", features = ["body-parse"] }
sql-traits = { git = "https://github.com/connetto-rs/sql-traits", branch = "main", default-features = false }
# Reads, prints and computes PostgreSQL intervals the way PostgreSQL 18 does.
sql-values = { version = "0.3", default-features = false }
git2 = { version = "0.21", optional = true }
tempfile = { version = "3.27", optional = true }
thiserror = { version = "2.0", default-features = false }
# Grows the stack on demand in the translator's recursion, as `sqlparser`'s
# `recursive-protection` does in its parser.
recursive = { version = "0.1", optional = true }
# Optional Arbitrary impls on the public option types so fuzz harnesses
# can drive `Pg2SqliteOptions` (and its dependent enums) from libfuzzer
# input bytes. Gated behind the `arbitrary` feature so production
# builds don't pull the dep.
arbitrary = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
diesel = { version = "2.3.9", features = ["postgres", "sqlite"] }
half = "2.7"
insta = "1.47.2"
rosetta-uuid = { version = "0.2.0", features = ["diesel", "postgres", "sqlite"] }
rusqlite = { version = "0.41", features = ["bundled", "functions", "window"] }
sqlite-vec = "0.1.9"
zerocopy = "0.8.48"
rand = "0.10.1"
tempfile = "3.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
testcontainers = { version = "0.27", features = ["blocking"] }
parking_lot = "0.13.0"

# Optional integration gated by the `sqlitegis` feature. Declared in
# `[dependencies]` (not `[dev-dependencies]`) because Cargo only honors
# `optional = true` on regular dependencies. Still test-only: nothing
# in `src/` references it unless `feature = "sqlitegis"` is set.
[dependencies.sqlitegis]
version = "0.3.2"
default-features = false
features = ["sqlite", "diesel-sqlite"]
optional = true

[dependencies.libsqlite3-sys]
version = "0.39"
optional = true

[features]
# Drop the defaults with `--no-default-features` to build for `wasm32-unknown-unknown` or other no_std targets.
# The sqlparser patch below is what lets `sqlparser/visitor` build without std.
default = ["std", "git"]
# Filesystem loaders, std error variants, and stack growth in the parser and translator.
std = [
    "sqlparser/std",
    "sqlparser/recursive-protection",
    "sql-traits/std",
    "dep:recursive",
    "thiserror/std",
]
# `Pg2Sqlite::from_git`, kept out of `std` so dependents that never clone a schema skip libgit2.
git = ["std", "dep:git2", "dep:tempfile"]
# SQLiteGIS Diesel + native-SQLite spatial integration is native-only,
# so it implies `std`.
sqlitegis = [
    "std",
    "dep:sqlitegis",
    "dep:libsqlite3-sys",
]
# Derives `Arbitrary` on `Pg2SqliteOptions`, `UuidRepresentation`,
# `SessionVariablePattern`, `SessionVariableValue`, and
# `SessionVariableMapping`. Consumed by the fuzz harnesses; not used by
# production code.
arbitrary = ["dep:arbitrary"]

# Every crate in this graph targets unreleased sqlparser AST, so this patch is
# not droppable. Against released 0.62.0 the build dies inside `sql-traits`
# first, on `TableConstraint::Exclude` and `UniqueConstraint::include`, and this
# crate's own source then fails on `Statement::CreateTextSearch`,
# `AlterTextSearch`, `CreateFileFormat`, `CreateWarehouse`, `Put`,
# `Expr::IsJson`, `JsonPredicateType`, `JsonKeyUniqueness`, and the `unlogged`
# field. Dropping the patch therefore waits on a sqlparser release carrying that
# AST and a `sql-traits` revision built against it, which is also what blocks
# publishing this crate to crates.io.
#
# Patching at the workspace root unifies every dependent (sql-traits, sql_docs)
# onto a single sqlparser so dialect types stay compatible across crate
# boundaries. `sqlparser_derive` follows automatically as a path dependency of
# the git sqlparser, so it needs no separate patch.
[patch.crates-io]
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }

# `SqliteConnection::set_triggers_enabled` and its db-config siblings are on
# diesel main and absent from 2.3.12, and the RLS trigger tests need them.
diesel = { git = "https://github.com/diesel-rs/diesel", branch = "main" }

[[test]]
name = "it"
path = "tests/it/main.rs"

# Separate because the PostgreSQL harness sweeps abandoned containers when it
# starts, and in a process shared with the other PostgreSQL-backed tests that
# sweep races the sweep test's setup, removing the container it created as
# abandoned before it can inspect it.
[[test]]
name = "test_postgres_harness_lifecycle"
path = "tests/test_postgres_harness_lifecycle.rs"

# Separate because sqlite-vec is registered with `sqlite3_auto_extension`,
# which loads it into every later connection in the process.
[[test]]
name = "sqlite_vec"
path = "tests/sqlite_vec/main.rs"

# Separate because SQLiteGIS is registered with `sqlite3_auto_extension`,
# which loads it into every later connection in the process.
[[test]]
name = "sqlitegis"
path = "tests/sqlitegis/main.rs"
required-features = ["sqlitegis"]

# Separate because it registers both sqlite-vec and, with the `sqlitegis`
# feature, SQLiteGIS with `sqlite3_auto_extension`, so it shares a process
# with neither group above.
[[test]]
name = "test_playground_sample_queries"
path = "tests/test_playground_sample_queries.rs"

[[bench]]
name = "translation"
harness = false

# Build profile for cargo-mutants, selected by .cargo/mutants.toml.
[profile.mutants]
inherits = "test"
debug = "none"

[lints.rust]
missing_docs = "deny"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
deprecated = "deny"

[lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
missing_crate_level_docs = "forbid"
unescaped_backticks = "forbid"
redundant_explicit_links = "forbid"
invalid_rust_codeblocks = "forbid"

[lints.clippy]
unreadable_literal = "allow"
missing_panics_doc = "allow"
new_ret_no_self = "allow"
struct_excessive_bools = "allow"
should_panic_without_expect = "allow"
doc_markdown = "allow"
needless_raw_string_hashes = "allow"
items_after_statements = "allow"
needless_borrows_for_generic_args = "allow"
redundant_closure_for_method_calls = "allow"
uninlined_format_args = "allow"
approx_constant = "allow"
clone_on_copy = "forbid"
pedantic = { level = "deny", priority = -1 }
