name: Audit

on:
  schedule:
    - cron: "0 0 * * 0" # Run weekly on Sundays
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - deny.toml
      - .cargo/audit.toml
      - .github/workflows/audit.yml
  pull_request:
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - deny.toml
      - .cargo/audit.toml
      - .github/workflows/audit.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deny-

      # The lockfile is not tracked, since committing it freezes the git
      # dependency at one commit. cargo-deny needs one, so resolve it here.
      - name: Generate a lockfile
        run: cargo generate-lockfile

      - name: Install cargo-deny
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        run: cargo deny check
